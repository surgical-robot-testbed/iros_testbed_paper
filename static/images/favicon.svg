<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a6e5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064d3f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8d8c8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4563a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e87a5e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Trocar / body wall line -->
  <rect x="160" y="235" width="192" height="10" rx="5" fill="#0d8a72" opacity="0.5" transform="rotate(-25, 256, 240)"/>

  <!-- Instrument shaft — main position -->
  <line x1="120" y1="380" x2="380" y2="115" stroke="url(#shaft)" stroke-width="14" stroke-linecap="round"/>

  <!-- Ghost shaft positions showing pivot -->
  <line x1="100" y1="350" x2="400" y2="145" stroke="#a8d8c8" stroke-width="6" stroke-linecap="round" opacity="0.15"/>
  <line x1="145" y1="400" x2="355" y2="90" stroke="#a8d8c8" stroke-width="6" stroke-linecap="round" opacity="0.15"/>

  <!-- RCM point — the star of the show -->
  <circle cx="256" cy="243" r="28" fill="none" stroke="url(#accent)" stroke-width="6"/>
  <circle cx="256" cy="243" r="10" fill="url(#accent)"/>

  <!-- Pivot arc arrows -->
  <path d="M 200 310 A 90 90 0 0 1 175 270" fill="none" stroke="#e8f5f1" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 310 175 A 90 90 0 0 1 340 210" fill="none" stroke="#e8f5f1" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- Small arrowheads on arcs -->
  <polygon points="170,272 182,264 178,280" fill="#e8f5f1" opacity="0.5"/>
  <polygon points="344,208 332,216 336,200" fill="#e8f5f1" opacity="0.5"/>

  <!-- End effector dot -->
  <circle cx="120" cy="380" r="16" fill="#e8f5f1" opacity="0.8"/>

  <!-- Tip dot -->
  <circle cx="380" cy="115" r="12" fill="#e8f5f1"/>

  <!-- Gripper jaws at tip -->
  <line x1="380" y1="115" x2="405" y2="90" stroke="#e8f5f1" stroke-width="8" stroke-linecap="round"/>
  <line x1="380" y1="115" x2="410" y2="105" stroke="#e8f5f1" stroke-width="8" stroke-linecap="round"/>
</svg>